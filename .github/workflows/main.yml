name: CI Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap roles
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -v app_pw=app_password_ci \
            -v platform_pw=platform_password_ci \
            -f db/bootstrap/roles.sql

      - name: Run Complete Verification Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://cmms_app:app_password_ci@localhost:5432/postgres
          PLATFORM_DB_URL: postgres://cmms_platform:platform_password_ci@localhost:5432/postgres
          ADMIN_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/postgres
          PLATFORM_ADMIN_TOKEN: ci-secret-platform-admin-token-12345
        run: npm run verify

      - name: Publish Performance Summary
        if: always()
        run: |
          if [ -f doc/perf/prompt-01.txt ]; then
            cat doc/perf/prompt-01.txt >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f doc/perf/prompt-02.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat doc/perf/prompt-02.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit performance report
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if { [ -f doc/perf/prompt-01.txt ] && ! git diff --quiet -- doc/perf/prompt-01.txt; } || { [ -f doc/perf/prompt-02.txt ] && ! git diff --quiet -- doc/perf/prompt-02.txt; }; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add doc/perf/
            git commit -m "chore: update performance reports [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload Performance Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: doc/perf/
          if-no-files-found: warn
